    <noscript><main style="background:#071a12;color:#ddd5c4;padding:8%;font:20px/1.6 sans-serif;min-height:100vh"><h1>Arvessa — under utveckling</h1><p>Så är Arvessa tänkt att gå från data till bevattningsråd.</p><h2>Från satellit till gård</h2><p>Satellitbilder ska undersökas tillsammans med väder, nederbörd, jord och gårdens egna uppgifter om bevattning och vattenkällor.</p><h2>Under marken</h2><p>Vatten tas upp av grödan, avdunstar, rinner bort eller passerar under rötterna. FAO-56 är tänkt som fysikalisk bas. Bevattningsmotorn är ännu inte byggd.</p><h2>Ett begripligt veckokort</h2><p>Det avsedda systemet ska sammanföra informationen till ett råd via WhatsApp eller papper. Det finns inga validerade råd eller visade besparingar ännu.</p><h2>Pilotfasen</h2><p>Första fasen planeras som en skuggpilot där modellens råd inte styr bevattningen. Ingen pilotgård är bekräftad i projektunderlaget.</p><p><a style="color:#d9923b" href="https://github.com/lilmad1/arvessa">Följ det publika repot</a></p><p>Aktivera JavaScript för den interaktiva berättelsen.</p></main></noscript>
